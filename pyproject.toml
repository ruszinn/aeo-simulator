[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeosim"
version = "0.1.0"
description = "Simulator of how AI search agents find and recommend B2B service providers (AEO research)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "pandas>=2",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "flask>=3",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
hybrid = ["sentence-transformers"]
dev = ["pytest>=8"]

[project.scripts]
aeosim = "aeosim.cli:main"

[tool.setuptools.packages.find]
include = ["aeosim*"]
