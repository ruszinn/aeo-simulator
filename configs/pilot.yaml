# Pilot: a small offline run that exercises the whole pipeline for free.
# Two agents (keyword baseline and the scripted test model) x two profiles x 40 scenarios.
experiment:
  name: pilot
  category: freight_trucking     # or contract_packaging
  n_scenarios: 40
  seed: 7                        # scenario seed: same seed, same scenarios
  corpus_seed: 1                 # firm pool seed: keep fixed across experiments
  pool_size: 40                  # firms in the category
  market_size: 12                # firms in each scenario's market
  min_full_fit: 2                # firms per scenario that fully match the brief
  shortlist_size: 3              # firms the agent recommends

features:                        # probability each switch is on, per firm per scenario
  markdown: 0.5
  llms_txt: 0.5
  schema_jsonld: 0.5
  js_rendered: 0.3
  faq_page: 0.5
  directory_listing: 0.5
  descriptive_heading: 0.5

# Platform profiles (profiles/*.yaml) set the crawler, fetcher, snippet and agent
# settings. Every model runs under every listed profile on the same scenarios.
profiles:
  - chatgpt_thinking
  - chatgpt_instant

models:
  - models/baseline.yaml
  - models/scripted.yaml

max_workers: 4
output_dir: runs
