# Seller experiment: one randomly drawn firm per scenario changes its site.
# strategy: aeo_checklist | keyword_enrich | llm_rewrite
experiment:
  name: seller_checklist
  category: freight_trucking
  n_scenarios: 200
  seed: 21
  corpus_seed: 1
features: {markdown: 0.5, llms_txt: 0.5, schema_jsonld: 0.5, js_rendered: 0.3, faq_page: 0.5, directory_listing: 0.5, descriptive_heading: 0.5}
search: {mode: ranked}
seller:
  strategy: aeo_checklist
  focal_firm: null                 # or a firm id like fr_012 to follow one firm
  rewriter_model: models/claude-sonnet-4-5.yaml   # used by llm_rewrite only
models:
  - models/baseline.yaml
max_workers: 4
output_dir: runs
