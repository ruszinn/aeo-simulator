# Main experiment. Search results come back in score order, so the retrieval
# stage (which firms surface) reflects each site's features.
# Start with the keyword baseline to check the run, then add LLM models.
experiment:
  name: main_ranked
  category: freight_trucking
  n_scenarios: 500
  seed: 11
  corpus_seed: 1
  pool_size: 40
  market_size: 12
  min_full_fit: 2
  shortlist_size: 3
features: {markdown: 0.5, llms_txt: 0.5, schema_jsonld: 0.5, js_rendered: 0.3, faq_page: 0.5, directory_listing: 0.5}
web: {fetcher: prefer_markdown, crawler_renders_js: false}
search: {method: bm25, mode: ranked}
agent: {max_searches: 3, max_fetches: 5, max_steps: 14}
models:
  - models/baseline.yaml
  # - models/claude-sonnet-4-5.yaml
  # - models/gpt-5-1.yaml
  # - models/gemini-2-5-flash.yaml
max_workers: 4
output_dir: runs
