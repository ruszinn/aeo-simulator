# Selection experiment. Search results come back in random order, so a
# firm's position is independent of its site; the analysis then adds
# result position as a control and isolates what reading the site does.
experiment:
  name: main_shuffled
  category: freight_trucking
  n_scenarios: 500
  seed: 12
  corpus_seed: 1
features: {markdown: 0.5, llms_txt: 0.5, schema_jsonld: 0.5, js_rendered: 0.3, faq_page: 0.5, directory_listing: 0.5}
web: {fetcher: prefer_markdown}
search: {method: bm25, mode: shuffled}
models:
  - models/baseline.yaml
max_workers: 4
output_dir: runs
